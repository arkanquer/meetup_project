<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MeetUp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --sego-pink: #f76a8c;
            --sego-gradient: linear-gradient(135deg, #f76a8c 0%, #f99f92 100%);
            --sego-gradient-hover: linear-gradient(135deg, #e55b7d 0%, #e88e81 100%);
            --sego-dark: #1e1e2f;
            --sego-bg: #f8f9fa;
        }

        body {
            background-color: var(--sego-bg) !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333333;
        }

        *, .card, .main-container, .btn, .form-control, .form-select, .badge, .list-group-item, .alert {
            border-radius: 0px !important;
        }

        .navbar {
            background-color: #ffffff !important;
            border-bottom: 2px solid var(--sego-pink) !important;
        }
        .navbar-brand {
            color: var(--sego-pink) !important;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }
        .navbar .nav-link {
            color: #555555 !important;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .navbar .nav-link:hover {
            color: var(--sego-pink) !important;
        }

        .card, .main-container {
            background-color: #ffffff !important;
            border: 1px solid var(--sego-pink) !important;
            box-shadow: none !important;
        }

        .bg-light {
            background-color: #ffffff !important;
            border: 1px solid rgba(247, 106, 140, 0.3) !important;
        }

        .card:hover {
            border-color: #e55b7d !important;
            box-shadow: 0 0 10px rgba(247, 106, 140, 0.15) !important;
        }

        .btn-success {
            background: var(--sego-gradient) !important;
            border: 1px solid var(--sego-pink) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            transition: all 0.15s ease-in-out !important;
        }
        .btn-success:hover {
            background: var(--sego-gradient-hover) !important;
            box-shadow: 0 0 8px rgba(247, 106, 140, 0.3) !important;
        }

        .btn-outline-success {
            color: var(--sego-pink) !important;
            border: 1px solid var(--sego-pink) !important;
            font-weight: 600 !important;
        }
        .btn-outline-success:hover {
            background: var(--sego-gradient) !important;
            color: #ffffff !important;
            border-color: transparent !important;
        }

        .btn-primary {
            background-color: var(--sego-dark) !important;
            border: 1px solid var(--sego-dark) !important;
            color: white !important;
        }
        .btn-primary:hover {
            background-color: #2b2b3d !important;
        }

        .text-success {
            color: var(--sego-pink) !important;
        }
        .badge.bg-success {
            background: var(--sego-gradient) !important;
            color: white !important;
        }
        .badge.bg-success-subtle {
            background-color: #fff0f2 !important;
            color: var(--sego-pink) !important;
        }

        .border-start.border-success {
            border-left: 4px solid var(--sego-pink) !important;
        }
        .border-start.border-dark {
            border-left: 4px solid var(--sego-dark) !important;
        }

        .form-control, .form-select {
            border: 1px solid #ced4da !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--sego-pink) !important;
            box-shadow: 0 0 0 0.25rem rgba(247, 106, 140, 0.2) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg shadow-sm mb-5 py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="navbar-nav me-auto flex-row">
                    <a class="nav-link px-3" href="{% url 'home' %}">Головна</a>
                    <a class="nav-link px-3" href="{% url 'top_users' %}">Рейтинг</a>
                </div>

                <div class="navbar-nav align-items-center flex-row">
                    {% if request.user.is_authenticated %}
                        <span class="navbar-text me-3 d-none d-sm-inline">
                            Вітаємо, <strong class="text-dark">@{{ request.user.username }}</strong>!
                        </span>
                        <a href="{% url 'profile' %}" class="btn btn-sm btn-success me-2 px-3 py-2">Мій профіль</a>
                        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger px-3 py-2">Вийти</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-sm btn-outline-secondary me-2 px-3 py-2">Вхід</a>
                        <a href="{% url 'register' %}" class="btn btn-sm btn-success px-3 py-2">Реєстрація</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="bg-white p-4 p-md-5 main-container mb-5">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
